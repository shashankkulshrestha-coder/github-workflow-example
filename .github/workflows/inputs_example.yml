name: Terraform inputs demo

on:
 workflow_dispatch: 
   inputs:
     region:
       description: GCP Project Region
       required: true
       default: local-region

jobs:
  terraform:
    runs-on: ubuntu-22.04

    env:
      TF_VAR_region: ${{ inputs.region }}

    steps:
      - uses: actions/checkout@v4

      - name: Show variable
        run: |
          echo "Region = $TF_VAR_region"

      - name: Terraform Plan
        run: terraform plan
        
